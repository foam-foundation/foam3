<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace">

  <!-- Background -->
  <rect width="700" height="300" fill="#f8f9fa" rx="8"/>

  <!-- ── LEFT: CLIENT panel ── -->
  <rect x="20" y="20" width="250" height="262" rx="8" fill="#eef4ff" stroke="#0055cc" stroke-width="1.5"/>
  <rect x="20" y="20" width="250" height="28"  rx="8" fill="#0055cc"/>
  <rect x="20" y="36" width="250" height="12"       fill="#0055cc"/>
  <text x="145" y="39" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700" letter-spacing="1">CLIENT</text>

  <!-- Your UI code -->
  <rect x="48" y="60" width="195" height="44" rx="6" fill="#fff" stroke="#0055cc" stroke-width="1.2"/>
  <text x="145" y="77" text-anchor="middle" fill="#333" font-size="12">Your UI code</text>
  <text x="145" y="93" text-anchor="middle" fill="#888" font-size="10" font-style="italic">calls service method</text>

  <!-- Arrow down A1 -->
  <line x1="145" y1="104" x2="145" y2="118" stroke="#555" stroke-width="1.5"/>
  <polygon points="145,122 140,112 150,112" fill="#555"/>

  <!-- ClientStub -->
  <rect x="48" y="122" width="195" height="58" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="145" y="143" text-anchor="middle" fill="#333" font-size="12" font-weight="600">ClientStub</text>
  <text x="145" y="160" text-anchor="middle" fill="#27ae60" font-size="10.5" font-style="italic">marshals call → RPCMessage</text>
  <text x="145" y="174" text-anchor="middle" fill="#27ae60" font-size="9.5" font-style="italic">(generated)</text>

  <!-- Arrow down A2 -->
  <line x1="145" y1="180" x2="145" y2="194" stroke="#555" stroke-width="1.5"/>
  <polygon points="145,198 140,188 150,188" fill="#555"/>

  <!-- Box (client) -->
  <rect x="48" y="198" width="195" height="48" rx="6" fill="#fff" stroke="#888" stroke-width="1.2"/>
  <text x="145" y="218" text-anchor="middle" fill="#555" font-size="12" font-weight="700">Box</text>
  <text x="145" y="234" text-anchor="middle" fill="#888" font-size="10" font-style="italic">sends envelope</text>

  <!-- ── RIGHT: SERVER panel ── -->
  <rect x="430" y="20" width="250" height="262" rx="8" fill="#f9f0ff" stroke="#8e44ad" stroke-width="1.5"/>
  <rect x="430" y="20" width="250" height="28"  rx="8" fill="#8e44ad"/>
  <rect x="430" y="36" width="250" height="12"       fill="#8e44ad"/>
  <text x="555" y="39" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700" letter-spacing="1">SERVER</text>

  <!-- Your service implementation -->
  <rect x="458" y="60" width="195" height="44" rx="6" fill="#fff" stroke="#8e44ad" stroke-width="1.2"/>
  <text x="555" y="77" text-anchor="middle" fill="#333" font-size="12">Your service impl</text>
  <text x="555" y="93" text-anchor="middle" fill="#888" font-size="10" font-style="italic">the real business logic</text>

  <!-- Arrow up B1 (Skeleton → service impl) -->
  <line x1="555" y1="118" x2="555" y2="108" stroke="#555" stroke-width="1.5"/>
  <polygon points="555,104 550,114 560,114" fill="#555"/>

  <!-- Skeleton -->
  <rect x="458" y="122" width="195" height="58" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="555" y="143" text-anchor="middle" fill="#333" font-size="12" font-weight="600">Skeleton</text>
  <text x="555" y="160" text-anchor="middle" fill="#27ae60" font-size="10.5" font-style="italic">unpacks → dispatches call</text>
  <text x="555" y="174" text-anchor="middle" fill="#27ae60" font-size="9.5" font-style="italic">(generated)</text>

  <!-- Arrow up B2 (Box → Skeleton) -->
  <line x1="555" y1="198" x2="555" y2="184" stroke="#555" stroke-width="1.5"/>
  <polygon points="555,180 550,190 560,190" fill="#555"/>

  <!-- Box (server) -->
  <rect x="458" y="198" width="195" height="48" rx="6" fill="#fff" stroke="#888" stroke-width="1.2"/>
  <text x="555" y="218" text-anchor="middle" fill="#555" font-size="12" font-weight="700">Box</text>
  <text x="555" y="234" text-anchor="middle" fill="#888" font-size="10" font-style="italic">receives envelope</text>

  <!-- ── Network arrow: client Box → server Box ── -->
  <!-- Extend line from within left box to within right box -->
  <line x1="243" y1="222" x2="458" y2="222" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="458,222 448,217 448,227" fill="#e67e22"/>

  <!-- Network label -->
  <text x="350" y="200" text-anchor="middle" fill="#e67e22" font-size="10.5" font-weight="600">Network</text>
  <text x="350" y="213" text-anchor="middle" fill="#e67e22" font-size="9.5" font-style="italic">(or direct / in-process)</text>

  <!-- Caption -->
  <text x="350" y="292" text-anchor="middle" fill="#999" font-size="10" font-style="italic">Generated code handles marshalling, transport, and dispatch — you write only the interface and the implementation.</text>

</svg>
